---
driver:
  name: "podman"

platforms:
  - name: "instance-lego"
    image: "docker.io/geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    cgroupns_mode: "host"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    pre_build_image: true

provisioner:
  name: "ansible"
  options:
    D: true

verifier:
  name: "ansible"

scenario:
  name: "default"
  test_sequence:
    - "cleanup"
    - "destroy"
    - "syntax"
    - "create"
    - "prepare"
    - "converge"
    - "idempotence"
    - "side_effect"
    - "verify"
    - "cleanup"
    - "destroy"
